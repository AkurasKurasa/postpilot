# Builds the React client and deploys it to GitHub Pages. The API runs separately on Render.
# Docs: https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages
name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress deploy finish instead of cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Server tests (deploy only after tests pass)
        run: npm ci --prefix server && npm test --prefix server

      - name: Require the API URL
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the repository variable VITE_API_URL to the Render API URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Build client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci --prefix client
          npm run build --prefix client -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
